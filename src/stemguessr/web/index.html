<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StemGuessr</title>
    <!-- Force the browser to revalidate styles.css and game.js on each load.
         The frontend is iterated in place during development; without this,
         users would silently keep running an old cached game.js after the
         repo updates. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
    <!-- Declaring an icon here also stops the browser's default /favicon.ico
         probe (which the server has nothing to serve), removing the 404. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>StemGuessr</h1>
        <p class="status" id="status-line">Loading…</p>
    </header>

    <!-- HUD: fixed top-right chip cluster. Deliberately tiny so the main
         UI is unchanged; panels expand on hover/focus only. -->
    <div class="hud">
        <div class="hud-item">
            <button class="hud-chip" id="score-chip" type="button"
                    aria-haspopup="true"
                    title="Hover for the per-stage breakdown">score 0/0</button>
            <div class="hud-panel" id="score-panel" role="tooltip"></div>
        </div>
        <button class="hud-chip" id="reset-btn" type="button"
                title="Delete the ingested cache and choose a new playlist">↺ reset</button>
    </div>

    <main>
        <section class="ingest-prompt" id="ingest-prompt" hidden aria-label="Ingest a playlist">
            <h2>Choose a playlist</h2>
            <form id="ingest-form" autocomplete="off">
                <label for="playlist-url-input">Public Spotify playlist URL</label>
                <input type="url" id="playlist-url-input"
                       placeholder="https://open.spotify.com/playlist/..."
                       required spellcheck="false">
                <div class="ingest-options">
                    <label for="stems-select">Stems</label>
                    <select id="stems-select">
                        <option value="4" selected>4 (drums, bass, other, vocals)</option>
                        <option value="6">6 (+ piano, guitar)</option>
                    </select>
                    <label for="limit-input">Limit</label>
                    <input type="number" id="limit-input" min="1" placeholder="all">
                </div>
                <button type="submit" id="ingest-submit">Start ingest</button>
                <p class="ingest-hint">
                    First run downloads ~250&nbsp;MB of Demucs weights, then each
                    track takes ~5–15&nbsp;s to separate on CPU. Tracks become
                    playable as they finish.
                </p>
            </form>
        </section>

        <section class="player" id="player-section" aria-label="Audio player">
            <div class="player-visual">
                <canvas id="waveform" width="800" height="200" aria-hidden="true"></canvas>
            </div>
            <div class="controls">
                <button id="play-btn" type="button" aria-label="Play / pause">▶</button>
                <p class="round-label" id="round-label">—</p>
                <label class="volume-control" for="volume-slider">
                    <span class="volume-label">vol</span>
                    <input type="range" id="volume-slider" min="0" max="0.25" step="0.005" value="0.1">
                </label>
            </div>
            <div class="reveal-info" id="reveal-info" hidden aria-live="polite">
                <img id="player-cover" alt="" hidden>
                <h2 id="reveal-title">—</h2>
                <p class="reveal-artists" id="reveal-artists">—</p>
                <p class="reveal-outcome" id="reveal-outcome">—</p>
                <button id="next-track-btn" type="button">Next track →</button>
            </div>
        </section>

        <section class="guess" id="guess-section" aria-label="Guess input">
            <form id="guess-form" autocomplete="off">
                <input type="text" id="guess-input" placeholder="Type your guess…" autocomplete="off" spellcheck="false">
                <button type="submit">Guess</button>
                <button type="button" id="skip-btn">Skip</button>
            </form>
            <ol class="guess-list" id="guess-list" aria-live="polite"></ol>
        </section>

    </main>

    <footer>
        <p><a href="https://github.com/kyleyhw/stemguessr">source</a> · stems via <a href="https://github.com/facebookresearch/demucs">Demucs</a></p>
    </footer>

    <script src="game.js" type="module"></script>
</body>
</html>
