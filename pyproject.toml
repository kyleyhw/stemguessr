[project]
name = "stemguessr"
version = "0.1.0"
description = "A Bandle-style music-guessing game built around Demucs-separated stems from a Spotify public playlist URL."
readme = "README.md"
authors = [
    { name = "Kyle", email = "kyleyhw@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "demucs>=4.0.1",
    "httpx>=0.28.1",
    "spotipy>=2.26.0",
]

[project.scripts]
stemguessr = "stemguessr:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
